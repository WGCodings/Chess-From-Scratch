[package]
name = "chess-from-scratch"
version = "2.0"
description = "Chess From Scratch: build, run and test chess engines with blocks"
authors = ["WG"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"

# Its own workspace: the engine crates at the repository root don't build the desktop app.
[workspace]

[lib]
name = "cfs_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
# Downloading fastchess and opening books the first time a test runs.
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
