[package]
name = "chess-from-scratch"
version = "0.1.0"
description = "Chess From Scratch: build, run and test chess engines with blocks"
authors = ["WG"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"

# Its own workspace: the engine crates at the repository root don't build the desktop app.
[workspace]

[lib]
name = "cfs_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
