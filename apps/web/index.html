<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Chess From Scratch</title>
  </head>
  <body>
    <header class="topbar">
      <div class="left">
        <div class="menu-wrap">
          <button id="menu-btn" class="btn menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" title="Menu: new, open, save, guide, tutorial">☰</button>
          <nav id="menu" class="menu" hidden aria-label="Menu">
            <button id="open" class="menu-item" type="button" title="Open a .cfs project, a workspace.json or a .block.rs block file">Open…</button>
            <button id="template-toggle" class="menu-item has-sub" type="button" aria-expanded="false" aria-controls="template-list" title="Start a new engine from a template (replaces the current one; it asks first)">New from template…</button>
            <div id="template-list" class="menu-sub" hidden>
              <button type="button" class="menu-item" data-template="empty">Empty (just the engine)</button>
              <button type="button" class="menu-item" data-template="starter">Starter engine (negamax + evaluation)</button>
              <button type="button" class="menu-item" data-template="reference">Every block</button>
            </div>
            <hr />
            <button id="save" class="menu-item" type="button" title="Save the project, with all its branches, tests and blocks, as a .cfs file">Save</button>
            <button id="save-as" class="menu-item" type="button" hidden title="Save the project to another file">Save as…</button>
            <button id="link-folder" class="menu-item" type="button" hidden title="Write the project into a folder on your computer and keep it in sync, to edit it in VS Code or any editor">Link folder</button>
            <hr />
            <button id="tutorial-btn" class="menu-item" type="button" title="A guided tour: build, read, compile and play your first engine">Tutorial: your first engine</button>
            <button id="tutorial2-btn" class="menu-item" type="button" title="From the random mover to a tested, stronger engine: branches and tests">Tutorial: branches and tests</button>
            <a id="guide-btn" class="menu-item" href="guide.html#Home" target="_blank" rel="noopener" title="How to build, change and make blocks, in simple steps">Guide</a>
            <a id="feedback-btn" class="menu-item" href="https://github.com/WGCodings/Chess-From-Scratch/issues" target="_blank" rel="noopener" title="Report a bug or share an idea (GitHub issues)">Feedback</a>
          </nav>
        </div>
        <div class="brand">
          <img src="/favicon.svg" alt="" width="24" height="24" />
          <span class="logo">Chess From Scratch</span>
        </div>
        <div class="views" role="tablist" aria-label="View">
          <button id="engine-btn" class="view-tab active" type="button" role="tab" aria-selected="true" title="Build your engine with blocks">Engine</button>
          <button id="tests-btn" class="view-tab" type="button" role="tab" aria-selected="false" title="Test two branches against each other (SPRT with fastchess) and see every test so far">Tests</button>
          <button id="play-btn" class="view-tab" type="button" role="tab" aria-selected="false" title="Play against a branch of your engine, or let two branches play">Play</button>
        </div>
      </div>
      <div class="actions">
        <span id="folder-status" class="folder-status" hidden></span>
        <button id="branch-btn" class="btn branch" type="button">⑂ main</button>
        <button id="terminal-btn" class="btn" type="button" title="A terminal in your engine's folder (desktop app)">Terminal</button>
        <button id="run-btn" class="btn run" type="button" title="Build your engine and talk to it: uci, go, bench… (desktop app)">▶ Run</button>
        <button id="export" class="btn primary" type="button">Export Rust project</button>
        <input id="file" type="file" accept=".cfs,.zip,.json,.rs,application/json,application/zip" hidden />
        <input id="block-file" type="file" accept=".rs" hidden />
      </div>
    </header>

    <main class="layout">
      <div id="workspace" class="workspace"></div>

      <aside class="side">
        <div class="explorer">
          <nav id="tree" class="tree" aria-label="Project files"></nav>
          <div class="code-wrap">
            <div class="code-head">
              <span id="code-path" class="code-path"></span>
              <span id="code-hint" class="code-hint">Double-click a line to edit its block</span>
              <button id="edit-code" class="btn small" type="button" title="Edit this file: code between // @block name and // @end name lines becomes blocks">Edit code</button>
              <button id="format-code" class="btn small" type="button" title="Re-indent the code (Shift+Alt+F)" hidden>Format</button>
              <button id="cancel-code" class="btn small" type="button" hidden>Cancel</button>
              <button id="save-code" class="btn small primary-dark" type="button" hidden>Save as blocks</button>
              <button id="copy" class="btn small" type="button">Copy</button>
            </div>
            <ul id="code-errors" class="code-errors" hidden></ul>
            <section id="tour" class="tour" hidden aria-live="polite"></section>
            <pre id="code" class="code" tabindex="0"></pre>
            <div id="code-editor" class="code-editor" hidden></div>
          </div>
        </div>
        <section class="issues" aria-live="polite">
          <h2>Status</h2>
          <ul id="issues"></ul>
        </section>
      </aside>
    </main>

    <main id="tests-view" hidden aria-label="Tests"></main>
    <main id="play-view" hidden aria-label="Play"></main>

    <section id="dock" hidden aria-label="Run and terminal"></section>

    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
